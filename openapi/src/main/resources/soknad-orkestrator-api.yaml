openapi: 3.0.0
info:
  title: Søknad Orkestrator API
  version: 1.0.0
  description: API for å opprette søknad, besvare opplysninger og hente neste seksjon.
  contact:
    name: '#team-dagpenger-brukerdialog'
servers:
  - url: https://dp-soknad-orkestrator.intern.dev.nav.no
    description: dev
  - url: https://dp-soknad-orkestrator.intern.nav.no
    description: prod
paths:
  /land:
    get:
      summary: Hent liste med alle land
      responses:
        '200':
          description: Liste med land returnert
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Land'
components:
  schemas:
    Opplysning:
      type: object
      properties:
        opplysningId:
          type: string
          format: uuid
        tekstnøkkel:
          type: string
        type:
          $ref: '#/components/schemas/Opplysningstype'
        svar:
          type: string
          nullable: true
          description: Svar kan være enten en string, boolean, dato eller periode (se Periodesvar) avhengig av hvilken type opplysning det er.
        gyldigeSvar:
          type: array
          items:
            type: string
          nullable: true
      required:
        - opplysningId
        - tekstnøkkel
        - type
    Opplysningstype:
      type: string
      enum:
        - land
        - periode
        - dato
        - tekst
        - boolean
    Seksjon:
      type: object
      properties:
        navn:
          $ref: '#/components/schemas/Seksjonsnavn'
        nesteUbesvarteOpplysning:
          $ref: '#/components/schemas/Opplysning'
        besvarteOpplysninger:
          type: array
          items:
            $ref: '#/components/schemas/Opplysning'
        erFullført:
          type: boolean
      required:
        - navn
        - besvarteOpplysninger
        - erFullført
    Seksjonsnavn:
      type: string
      enum:
        - bostedsland
    Periodesvar:
      type: object
      properties:
        fom:
          type: string
          format: date
        tom:
          type: string
          format: date
      required:
        - fom
    Land:
      type: object
      properties:
        alpha3kode:
          type: string
          example: NOR
        navn:
          type: string
          example: Norge
      required:
        - alpha3kode
        - navn
    HtmlDokument:
      type: object
      properties:
        html:
          type: string
          description: Skjemaet bruker har fylt som html, inkludert styling
      required:
        - html



